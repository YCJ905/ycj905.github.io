<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages 图床</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #f4f5f7;
            padding: 20px;
        }
        header {
            background: linear-gradient(135deg, #7b2cbf, #5a189a);
            color: white;
            padding: 18px 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap:12px;
        }
        .container {
            max-width: 1200px;
            margin:0 auto;
        }
        .card {
            background:#fff;
            border-radius:12px;
            box-shadow:0 2px 10px #00000012;
            padding:20px;
            margin-bottom:20px;
        }
        .row {
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            align-items:center;
        }
        input[type="text"] {
            flex:1;
            min-width:260px;
            padding:10px 14px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:14px;
        }
        button {
            padding:10px 16px;
            border:none;
            border-radius:8px;
            background:#7b2cbf;
            color:white;
            cursor:pointer;
            font-size:14px;
        }
        button:hover {
            background:#641c9c;
        }
        .upload-area {
            border:2px dashed #bbb;
            border-radius:10px;
            padding:30px;
            text-align:center;
            margin:16px 0;
        }
        .upload-area.active {
            border-color:#7b2cbf;
            background:#f7f0ff;
        }
        .gallery-grid {
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
            gap:16px;
            margin-top:16px;
        }
        .file-card {
            background:#fff;
            border-radius:10px;
            box-shadow:0 2px 8px #00000010;
            overflow:hidden;
        }
        .file-preview {
            height:160px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#f8f8f8;
        }
        .file-preview img {
            max-width:100%;
            max-height:100%;
            object-fit:contain;
        }
        .file-info {
            padding:12px;
        }
        .file-name {
            font-size:13px;
            margin-bottom:8px;
            word-break:break-all;
        }
        .file-info input {
            width:100%;
            margin-bottom:8px;
        }
        .file-info .btn-group {
            display:flex;
            gap:6px;
        }
        .file-info button {
            padding:6px 8px;
            font-size:12px;
            flex:1;
        }
        .toast {
            position:fixed;
            bottom:30px;
            left:50%;
            transform:translateX(-50%);
            background:#222;
            color:white;
            padding:10px 20px;
            border-radius:8px;
            opacity:0;
            transition:0.3s;
            pointer-events:none;
        }
        .toast.show {
            opacity:1;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h2>GitHub Pages 图床</h2>
        <button id="refreshBtn">刷新图库</button>
    </header>

    <div class="card">
        <div class="row">
            <input id="tokenInput" placeholder="填入 GitHub Personal Access Token">
            <button id="saveTokenBtn">保存Token</button>
        </div>
    </div>

    <div class="card">
        <div class="upload-area" id="dropArea">
            <p>点击选择文件 / 拖拽文件到此处上传（支持多选）</p>
            <input type="file" id="fileInput" multiple hidden accept="image/*,audio/*,.svg,.ico,.bmp">
        </div>
    </div>

    <div class="card">
        <h3>图库</h3>
        <div class="gallery-grid" id="gallery"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== 在这里修改你的信息 ==========
const username = "YCJ905";
const repo = "YCJ905.github.io";
const branch = "main";
// ========================================

const tokenKey = "gh_token";
const tokenInput = document.getElementById("tokenInput");
const saveTokenBtn = document.getElementById("saveTokenBtn");
const dropArea = document.getElementById("dropArea");
const fileInput = document.getElementById("fileInput");
const refreshBtn = document.getElementById("refreshBtn");
const gallery = document.getElementById("gallery");
const toast = document.getElementById("toast");

// 读取本地存储token
tokenInput.value = localStorage.getItem(tokenKey) || "";

function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"),2200);
}

saveTokenBtn.onclick = ()=>{
    localStorage.setItem(tokenKey, tokenInput.value.trim());
    showToast("Token已保存");
};

dropArea.onclick = ()=> fileInput.click();
dropArea.ondragover = e=>{ e.preventDefault(); dropArea.classList.add("active"); };
dropArea.ondragleave = ()=> dropArea.classList.remove("active");
dropArea.ondrop = e=>{
    e.preventDefault();
    dropArea.classList.remove("active");
    handleFiles(e.dataTransfer.files);
};
fileInput.onchange = ()=> handleFiles(fileInput.files);

async function handleFiles(files) {
    const token = localStorage.getItem(tokenKey);
    if(!token) return showToast("请先填写并保存Token！");
    for(const f of files) await uploadFile(f);
}

async function uploadFile(file) {
    const token = localStorage.getItem(tokenKey);
    const reader = new FileReader();
    return new Promise((res,rej)=>{
        reader.onload = async ()=>{
            const base64 = reader.result.split(",")[1];
            const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${file.name}`;
            try {
                const resp = await fetch(apiUrl, {
                    method:"PUT",
                    headers:{
                        "Authorization":`token ${token}`,
                        "Content-Type":"application/json"
                    },
                    body: JSON.stringify({
                        message:`upload ${file.name}`,
                        content: base64,
                        branch: branch
                    })
                });
                const data = await resp.json();
                if(!resp.ok) throw new Error(data.message || "上传失败");
                showToast(`${file.name} 上传成功`);
                refreshGallery();
                res();
            }catch(err){
                showToast(`${file.name} 失败:${err.message}`);
                rej(err);
            }
        };
        reader.readAsDataURL(file);
    });
}

async function refreshGallery() {
    const token = localStorage.getItem(tokenKey);
    if(!token) return showToast("请先填写Token");
    gallery.innerHTML = "";
    try{
        const resp = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/?ref=${branch}`,{
            headers:{"Authorization":`token ${token}`}
        });
        const list = await resp.json();
        if(!Array.isArray(list)) return;
        for(const item of list){
            if(item.type !== "file") continue;
            renderFileCard(item);
        }
    }catch(e){
        showToast("读取仓库文件失败");
    }
}

function renderFileCard(fileObj) {
    const {name, sha, download_url} = fileObj;
    const ghIoUrl = `https://${username}.github.io/${repo}/${name}`;
    const isImg = /\.(jpg|png|gif|webp|svg|bmp|ico)$/i.test(name);
    const isAudio = /\.(mp3|wav|m4a|ogg|flac|aac)$/i.test(name);

    const card = document.createElement("div");
    card.className = "file-card";
    let previewHtml = "";
    if(isImg){
        previewHtml = `<img src="${download_url}" alt="${name}">`;
    }else if(isAudio){
        previewHtml = `<audio controls src="${download_url}" style="width:90%">`;
    }else{
        previewHtml = `<span>${name}</span>`;
    }
    card.innerHTML = `
        <div class="file-preview">${previewHtml}</div>
        <div class="file-info">
            <div class="file-name">${name}</div>
            <input type="text" value="${ghIoUrl}" readonly>
            <div class="btn-group">
                <button class="copyBtn">复制链接</button>
                <button class="openBtn">打开</button>
                <button class="delBtn">删除</button>
            </div>
        </div>
    `;
    card.querySelector(".copyBtn").onclick = async ()=>{
        await navigator.clipboard.writeText(ghIoUrl);
        showToast("链接已复制");
    };
    card.querySelector(".openBtn").onclick = ()=> window.open(ghIoUrl,"_blank");
    card.querySelector(".delBtn").onclick = async ()=>{
        if(!confirm(`确定删除 ${name}？`)) return;
        await deleteFile(name, sha);
    };
    gallery.appendChild(card);
}

async function deleteFile(filename, sha) {
    const token = localStorage.getItem(tokenKey);
    const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${filename}`;
    try{
        const resp = await fetch(apiUrl,{
            method:"DELETE",
            headers:{"Authorization":`token ${token}`,"Content-Type":"application/json"},
            body:JSON.stringify({message:`delete ${filename}`, sha:sha, branch:branch})
        });
        if(!resp.ok) throw new Error("删除失败");
        showToast("已删除");
        refreshGallery();
    }catch(err){
        showToast(err.message);
    }
}
refreshBtn.onclick = refreshGallery;
</script>
</body>
</html>
